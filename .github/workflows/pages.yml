name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 公開方法（Settings → Pages → Source）がどちらでも届くように両方に配る:
#   1. gh-pages ブランチ（Deploy from a branch）
#   2. Pages アーティファクト（GitHub Actions）
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 配布用の単一HTMLを生成
        run: node scripts/build-single.mjs

      - name: 公開ディレクトリを組み立て
        run: |
          mkdir -p _site/download
          cp index.html manifest.webmanifest sw.js _site/
          cp -r assets icons _site/
          cp dist/ct-checker.html _site/download/
          touch _site/.nojekyll
          ls -R _site | head -40

      - name: gh-pages ブランチへ公開
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Pages の Source を「GitHub Actions」にしている場合だけ動かす。
  # 既定は gh-pages ブランチ運用なので実行しない（毎回失敗させないため）。
  # 使うときはリポジトリ変数 PAGES_SOURCE を actions に設定する。
  deploy:
    needs: build
    if: vars.PAGES_SOURCE == 'actions'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
